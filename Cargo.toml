[workspace]
resolver = "3"
members = ["crates/zumen-core", "crates/zumen-jww", "crates/zumen-sxf", "crates/zumen-dxf", "crates/zumen-dwg", "crates/zumen-convert", "crates/zumen", "crates/zumen-render", "crates/zumen-cli", "bindings/python", "bindings/wasm"]

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/zumenjs/zumen"
# 公開の前にライセンスを決める（docs/releasing.md）
publish = false

[workspace.dependencies]
zumen = { path = "crates/zumen" }
zumen-core = { path = "crates/zumen-core" }
zumen-jww = { path = "crates/zumen-jww" }
zumen-sxf = { path = "crates/zumen-sxf" }
zumen-dxf = { path = "crates/zumen-dxf" }
zumen-dwg = { path = "crates/zumen-dwg" }
zumen-convert = { path = "crates/zumen-convert" }
zumen-render = { path = "crates/zumen-render" }
encoding_rs = "0.8.42"
libm = "0.2.16"
pyo3 = "0.30.1"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
tiny-skia = "0.12.0"
ttf-parser = "0.25.1"
unicode-normalization = "0.1.26"
wasm-bindgen = "0.2.129"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = true
codegen-units = 1
