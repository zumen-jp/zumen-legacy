name: 機能・形式の要望
description: 機能の追加、図面形式や図形の対応を提案する
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: 必要なことと、その理由
      description: 形式の対応は、仕様やファイルの入手元も記載してください。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 参考ファイル
      description: 公開してよいファイルだけを添付してください。機密の図面は添付しないでください。
