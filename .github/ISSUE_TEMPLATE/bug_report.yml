name: 不具合の報告
description: 図面の読み取り・表示・操作の不具合を報告する
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        不具合の状況を教えてください。**機密の図面は添付しないでください。**
        問題を再現する最小の図面か、ファイルの形式・版などの説明で構いません。
  - type: dropdown
    id: format
    attributes:
      label: 図面の形式
      options:
        - SXF (SFC)
        - SXF (P21)
        - JWW / JWC / JWS
        - DXF
        - DWG
        - PDF
        - 形式によらない問題
    validations:
      required: true
  - type: input
    id: software
    attributes:
      label: 作成ソフトとバージョン
      placeholder: 例：Jw_cad 8.25a
  - type: textarea
    id: problem
    attributes:
      label: 起きたことと期待する動作
    validations:
      required: true
  - type: textarea
    id: notices
    attributes:
      label: ビューアに表示された注意事項
      description: 省略・代替された内容の一覧があれば記載してください。
  - type: input
    id: environment
    attributes:
      label: パッケージのバージョン・ブラウザ・OS
