name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.1.0 installs the version in package.json "packageManager"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Rust toolchain, components and the wasm32 target come from rust-toolchain.toml
      - run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2 (it also keeps the binaries in ~/.cargo/bin)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
      # wasm-bindgen-cli writes the JavaScript of the WebAssembly reader (scripts/wasm.mjs, packages/reader/wasm) and must
      # be the version of the wasm-bindgen crate in Cargo.lock
      - run: >-
          cargo install wasm-bindgen-cli --locked --version
          "$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')"
      # astral-sh/setup-uv v10.3.0 (Python comes from bindings/python/.python-version)
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
      - run: pnpm install --frozen-lockfile
      # The tests of the drawing engine and the React hooks (*.browser.test.*) run in the Chromium headless shell of
      # the Playwright version in package.json
      - run: pnpm exec playwright install --with-deps --only-shell chromium
      - run: pnpm run check
