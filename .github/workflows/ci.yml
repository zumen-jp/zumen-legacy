name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # The names of the required checks of main
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # The browser tests (*.browser.test.*) run in Chromium, Firefox and WebKit on Ubuntu, and in Chromium only on
        # Windows: the Windows job already takes twice as long (installing the Chromium headless shell alone takes about
        # three minutes there), and these tests check the browser engines (Canvas, input events, the worker and
        # WebAssembly) rather than the system, which Chromium still covers on Windows
        include:
          - os: ubuntu-latest
            browsers: chromium firefox webkit
          - os: windows-latest
            browsers: chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # pnpm/action-setup v6.1.0 installs the version in package.json "packageManager"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      # actions/setup-node v7.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm
      # The Rust toolchain, components and the wasm32 target come from rust-toolchain.toml
      - run: rustup toolchain install
      # Swatinem/rust-cache v2.9.2 (it also keeps the binaries in ~/.cargo/bin)
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
      # wasm-bindgen-cli writes the JavaScript of the WebAssembly reader (scripts/wasm.mjs, packages/reader/wasm) and must
      # be the version of the wasm-bindgen crate in Cargo.lock
      - run: node scripts/install-wasm-bindgen.mjs
      # astral-sh/setup-uv v10.3.0 (Python comes from bindings/python/.python-version)
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
      - run: pnpm install --frozen-lockfile
      # The tests of the drawing engine, the React hooks and the reader's worker (*.browser.test.*) run in the browsers
      # of the Playwright version in package.json (the headless shell for Chromium); ZUMEN_BROWSERS selects them in
      # vitest.config.ts
      - run: pnpm exec playwright install --with-deps --only-shell ${{ matrix.browsers }}
      - run: pnpm run check
        env:
          ZUMEN_BROWSERS: ${{ matrix.browsers }}
      # Exercise the installed wheel too: maturin develop alone does not verify wheel packaging.
      - run: uv run --project bindings/python --frozen maturin build --release -m bindings/python/Cargo.toml --out target/wheels
      - run: node scripts/check-wheel.mjs
