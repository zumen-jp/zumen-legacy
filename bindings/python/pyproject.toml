[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "zumen"
description = "日本の建築・土木の図面（SXF・JWW・DXF・DWG・PDF）を読み取り、描画・文字や図形の抽出・版の比較を行う"
readme = "README.md"
requires-python = ">=3.12"
keywords = ["cad", "drawing", "jww", "sxf", "dxf", "dwg", "aec"]
classifiers = [
  "Natural Language :: Japanese",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
]
# 同梱の BIZ UDGothic は拡張モジュールに埋め込まれるので、そのライセンス（SIL OFL 1.1、licenses/ はクレート側の
# OFL.txt のコピー）の全文をホイールの dist-info に入れる。zumen の MIT とリンクするクレートのライセンスも同梱する
license = "MIT"
license-files = ["LICENSE", "licenses/*"]
dynamic = ["version"]

[project.optional-dependencies]
# Scene.to_arrow の表（Apache-2.0）
arrow = ["pyarrow>=14"]
# MCP サーバー（zumen-mcp、公式の Python SDK、MIT）
mcp = ["mcp>=2.3,<3"]

[project.scripts]
zumen-mcp = "zumen.mcp:main"

[project.urls]
Repository = "https://github.com/zumenjs/zumen"

[dependency-groups]
# ezdxf（MIT）は、書き出した DXF を別の実装で読めるか確かめるテストだけに使う
dev = ["ezdxf==1.4.5", "maturin==1.15.0", "mcp==2.3.0", "pyarrow==25.0.1", "pytest==9.1.1", "ruff==0.17.1"]

[tool.maturin]
python-source = "python"
module-name = "zumen._zumen"

[tool.ruff]
line-length = 120

[tool.uv]
# 拡張モジュールは maturin develop で入れる（pnpm run check:python）
package = false
