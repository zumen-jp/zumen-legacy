[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "zumen"
description = "Read 2D drawings of Japanese construction (SXF, JWW and DXF now; DWG next), render them to PNG and extract their texts and entities"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["cad", "drawing", "jww", "sxf", "dxf", "dwg", "aec"]
classifiers = [
  # 公開の前にライセンスを決める（docs/releasing.md）。それまで PyPI へ送らない
  "Private :: Do Not Upload",
  "Programming Language :: Rust",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.optional-dependencies]
# Scene.to_arrow の表（Apache-2.0）
arrow = ["pyarrow>=14"]
# MCP サーバー（zumen-mcp、公式の Python SDK、MIT）
mcp = ["mcp>=2.3,<3"]

[project.scripts]
zumen-mcp = "zumen.mcp:main"

[project.urls]
Repository = "https://github.com/zumenjs/zumen"

[dependency-groups]
dev = ["maturin==1.15.0", "mcp==2.3.0", "pyarrow==25.0.1", "pytest==9.1.1", "ruff==0.17.1"]

[tool.maturin]
python-source = "python"
module-name = "zumen._zumen"

[tool.ruff]
line-length = 120

[tool.uv]
# 拡張モジュールは maturin develop で入れる（pnpm run check:python）
package = false
