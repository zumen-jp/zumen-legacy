[package]
name = "zumen-python"
description = "zumen の Python 拡張。日本の建築・土木の図面を読み取り、描画・解析する"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_zumen"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { workspace = true, features = ["abi3-py312"] }
serde.workspace = true
serde_json.workspace = true
zumen = { workspace = true, features = ["pdf"] }
zumen-render.workspace = true

[lints]
workspace = true
